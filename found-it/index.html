<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Found-it — Dashboard Interattiva</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #27AE60;
            --blue-accent: #2D9CDB;
            --bg: #F8FAF9;
            --surface: rgba(255, 255, 255, 0.9);
            --text: #1C2E24;
            --muted: #667A70;
            --border: rgba(0, 0, 0, 0.08);
            --radius: 28px;
            --shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow-x: hidden; }

        /* --- AUTH SYSTEM --- */
        #auth-overlay {
            position: fixed; inset: 0; z-index: 3000;
            background: radial-gradient(circle at top left, #E8F5E9 0%, #FFFFFF 50%, #E3F2FD 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.6s cubic-bezier(0.85, 0, 0.15, 1);
        }
        #auth-overlay.hidden { transform: translateY(-100%); pointer-events: none; }

        /* Contenitore Logo Centrale */
        .logo-placeholder {
            width: auto;
            min-width: 120px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 24px;
            background: white;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 20px;
            transition: 0.3s;
        }
        .logo-placeholder img { max-height: 100px; width: auto; object-fit: contain; }

        .auth-container { width: 90%; max-width: 850px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        
        .auth-choice { 
            background: white; padding: 50px 40px; border-radius: var(--radius); 
            box-shadow: var(--shadow); cursor: pointer; text-align: center; transition: 0.3s;
            border: 1px solid transparent;
        }
        .auth-choice:hover { transform: translateY(-10px); border-color: var(--green); }
        .auth-choice h2 { font-family: 'Syne'; font-size: 32px; margin-bottom: 8px; }
        .auth-icon { font-size: 50px; margin-bottom: 20px; }

        .form-card { background: white; padding: 45px; border-radius: var(--radius); box-shadow: var(--shadow); width: 100%; max-width: 440px; text-align: center; }

        /* --- DASHBOARD --- */
        nav { padding: 15px 48px; background: white; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .nav-logo-img { height: 45px; }
        
        .main-content { max-width: 1300px; margin: 30px auto; padding: 0 20px; display: grid; grid-template-columns: 360px 1fr; gap: 30px; }
        .card { background: white; border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 25px; }
        
        /* Battery Control */
        input[type=range] { width: 100%; cursor: pointer; accent-color: var(--green); margin: 15px 0; }
        .battery-display { display: flex; justify-content: space-between; font-weight: 700; color: var(--green); font-size: 18px; }

        .input-group { margin-bottom: 18px; }
        label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; color: var(--muted); }
        select, input[type=text], input[type=email], input[type=password] { width: 100%; padding: 14px; border-radius: 15px; border: 1px solid #E0E7E3; background: #F9FBFA; font-family: inherit; font-size: 15px; }
        
        .btn-green { width: 100%; padding: 18px; background: linear-gradient(135deg, var(--green), #2ECC71); color: white; border: none; border-radius: 60px; font-weight: 700; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 20px rgba(39, 174, 96, 0.3); font-size: 16px; }
        .btn-green:hover { transform: scale(1.02); filter: brightness(1.05); }
        
        .map-container { width: 100%; height: 700px; border-radius: 30px; overflow: hidden; background: #f0f0f0; border: 1px solid var(--border); box-shadow: var(--shadow); }
        iframe { width: 100%; height: 100%; border: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="logo-placeholder" id="main-logo-box"></div>

    <div class="auth-container" id="initial-choice">
        <div class="auth-choice" onclick="showForm('login')">
            <div class="auth-icon">🔑</div>
            <h2 style="color: var(--green);">Accedi</h2>
            <p style="color: var(--muted); font-size: 15px;">Bentornato nella community</p>
        </div>
        <div class="auth-choice" onclick="showForm('register')">
            <div class="auth-icon">✨</div>
            <h2 style="color: var(--blue-accent);">Registrati</h2>
            <p style="color: var(--muted); font-size: 15px;">Inizia il tuo viaggio green</p>
        </div>
    </div>

    <div id="login-panel" class="hidden">
        <div class="form-card">
            <h2 style="font-family: 'Syne'; color: var(--green); font-size: 32px;">Accedi</h2>
            <input type="email" id="login-email" placeholder="Email" style="margin-top:25px">
            <input type="password" placeholder="Password" style="margin-top:12px">
            <button class="btn-green" style="margin-top:25px" onclick="completeAuth('login-email')">ENTRA ORA</button>
            <p onclick="resetAuth()" style="margin-top:20px; cursor:pointer; text-decoration:underline; color: var(--muted); font-weight: 500;">Torna indietro</p>
        </div>
    </div>

    <div id="register-panel" class="hidden">
        <div class="form-card">
            <h2 style="font-family: 'Syne'; color: var(--blue-accent); font-size: 32px;">Registrati</h2>
            <input type="text" placeholder="Nome Completo" style="margin-top:25px">
            <input type="email" id="reg-email" placeholder="Email" style="margin-top:12px">
            <input type="password" placeholder="Crea Password" style="margin-top:12px">
            <button class="btn-green" style="margin-top:25px; background:var(--blue-accent)" onclick="completeAuth('reg-email')">CREA ACCOUNT</button>
            <p onclick="resetAuth()" style="margin-top:20px; cursor:pointer; text-decoration:underline; color: var(--muted); font-weight: 500;">Torna indietro</p>
        </div>
    </div>
</div>

<nav>
    <div id="nav-logo-container"></div>
    <div style="display: flex; align-items: center; gap: 25px;">
        <span id="user-display" style="font-weight: 700; color: var(--green); font-size: 15px;"></span>
        <button onclick="location.reload()" style="background: #FFF0F0; color: #E74C3C; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 800; font-size: 12px; letter-spacing: 0.5px;">ESCI</button>
    </div>
</nav>

<div class="main-content">
    <aside>
        <div class="card">
            <h3 style="font-family: 'Syne'; font-size: 18px; margin-bottom: 8px;">🔋 Batteria Veicolo</h3>
            <label style="text-transform: none; color: var(--muted);">Imposta la carica attuale:</label>
            <input type="range" id="battery-slider" min="1" max="100" value="85" oninput="updateBatteryUI(this.value)">
            <div class="battery-display">
                <span id="battery-val">85%</span>
                <span id="km-val" style="color: var(--muted); font-size: 14px;">340 km</span>
            </div>
        </div>

        <div class="card">
            <h2 style="font-family: 'Syne'; margin-bottom: 25px; font-size: 24px;">🗺️ Destinazione</h2>
            <div class="input-group">
                <label>Partenza</label>
                <select id="start-loc">
                    <option value="Bolzano, BZ">Bolzano</option>
                    <option value="Merano, BZ">Merano</option>
                    <option value="Bressanone, BZ">Bressanone</option>
                    <option value="Brunico, BZ">Brunico</option>
                </select>
            </div>
            <div class="input-group">
                <label>Arrivo</label>
                <select id="end-loc">
                    <option value="Merano, BZ">Merano</option>
                    <option value="Bolzano, BZ">Bolzano</option>
                    <option value="Ortisei, BZ">Ortisei (Val Gardena)</option>
                    <option value="Lago di Braies, BZ">Lago di Braies</option>
                </select>
            </div>
            <div class="input-group">
                <label>Mezzo Preferito</label>
                <select id="travel-mode">
                    <option value="driving">🚗 Auto Elettrica</option>
                    <option value="bicycling">🚲 Bicicletta Elettrica</option>
                </select>
            </div>
            <button class="btn-green" onclick="updateTrip()">TROVA PERCORSO</button>
        </div>
    </aside>

    <main>
        <div class="map-container" id="map-frame">
            <div style="display:flex; align-items:center; justify-content:center; height:100%; color:var(--muted); text-align:center; padding: 50px;">
                <p style="font-size: 18px; font-weight: 500;">Pronto a partire? <br> Imposta i parametri e calcola il tragitto.</p>
            </div>
        </div>
    </main>
</div>

<script>
    const MY_LOGO_URL = 'Immagine 2026-04-22 162701.png';

    function setupLogos() {
        const logoBox = document.getElementById('main-logo-box');
        const navContainer = document.getElementById('nav-logo-container');
        const img = document.createElement('img');
        img.src = MY_LOGO_URL;
        img.onload = function() {
            logoBox.appendChild(img.cloneNode(true));
            // Adattamento automatico della larghezza del box
            logoBox.style.width = (img.clientWidth + 40) + "px";
            
            const navImg = img.cloneNode(true);
            navImg.className = 'nav-logo-img';
            navContainer.appendChild(navImg);
        };
    }

    function updateBatteryUI(val) {
        document.getElementById('battery-val').innerText = val + "%";
        document.getElementById('km-val').innerText = (val * 4) + " km";
    }

    function showForm(type) {
        document.getElementById('initial-choice').classList.add('hidden');
        document.getElementById('login-panel').classList.add('hidden');
        document.getElementById('register-panel').classList.add('hidden');
        document.getElementById(type + '-panel').classList.remove('hidden');
    }

    function resetAuth() {
        document.getElementById('initial-choice').classList.remove('hidden');
        document.getElementById('login-panel').classList.add('hidden');
        document.getElementById('register-panel').classList.add('hidden');
    }

    function completeAuth(id) {
        const mail = document.getElementById(id).value;
        if(mail.includes('@')) {
            document.getElementById('auth-overlay').classList.add('hidden');
            document.getElementById('user-display').innerText = mail;
        } else { alert("Per favore, inserisci un indirizzo email valido."); }
    }

    function updateTrip() {
        const start = document.getElementById('start-loc').value;
        const end = document.getElementById('end-loc').value;
        // URL Google Maps per visualizzare il percorso integrato nell'iframe
        const mapUrl = `https://maps.google.com/maps?saddr=${encodeURIComponent(start)}&daddr=${encodeURIComponent(end)}&output=embed`;
        document.getElementById('map-frame').innerHTML = `<iframe src="${mapUrl}"></iframe>`;
    }

    window.onload = setupLogos;
</script>

</body>
</html>
